<header class="relative pt-20 pb-12 px-6 text-center">
  <!-- Language Selector -->
  <div class="absolute top-6 right-6 z-50">
    <app-language-selector></app-language-selector>
  </div>

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Terminal prompt kicker -->
    <p
      class="font-mono text-sm md:text-base text-slate-500 flex items-center justify-center gap-2"
      aria-hidden="true"
    >
      <span class="text-indigo-400">$</span>
      <span>whoami</span>
      <span class="caret-blink inline-block w-[0.55em] h-[1.1em] bg-indigo-400/70"></span>
    </p>

    <h1 class="text-5xl md:text-7xl font-bold tracking-tight text-white">
      Vinícius
      <span class="text-transparent bg-clip-text bg-linear-to-r from-indigo-400 to-cyan-400"
        >Nunes Martins</span
      >
    </h1>

    <p class="text-xl md:text-2xl text-slate-400 font-light max-w-2xl mx-auto" i18n>
      DevSecOps Engineer | Information Security Committee Member | Backend Developer
    </p>

    <address
      class="font-mono text-sm md:text-base text-slate-400 not-italic flex flex-wrap justify-center items-center gap-x-4 gap-y-2"
    >
      <div class="flex items-center gap-2">
        <ng-icon name="bootstrapGeoAlt" class="text-indigo-400 text-base"></ng-icon>
        <span i18n>São Paulo - SP</span>
      </div>
      <div class="hidden md:block text-slate-700">•</div>
      <a
        href="mailto:nunesmartinsvinicius@gmail.com"
        class="flex items-center gap-2 hover:text-indigo-400 transition-colors"
      >
        <ng-icon name="bootstrapEnvelope" class="text-indigo-400 text-base"></ng-icon>
        <span>nunesmartinsvinicius@gmail.com</span>
      </a>
      <div class="hidden md:block text-slate-700">•</div>
      <a
        href="tel:+5567992253525"
        class="flex items-center gap-2 hover:text-indigo-400 transition-colors"
      >
        <ng-icon name="bootstrapTelephone" class="text-indigo-400 text-base"></ng-icon>
        <span>(11) 9 8776-9651</span>
      </a>
    </address>

    <div class="flex justify-center gap-4 pt-4">
      <a
        href="https://www.linkedin.com/in/viniciusnunesmartins"
        target="_blank"
        class="flex items-center justify-center p-2 rounded-md border border-slate-700/60 bg-slate-900 text-slate-300 hover:border-indigo-400/60 hover:text-indigo-400 transition-colors"
      >
        <ng-icon name="bootstrapLinkedin" class="text-xl"></ng-icon>
      </a>
      <a
        href="https://github.com/nmvinicius"
        target="_blank"
        class="flex items-center justify-center p-2 rounded-md border border-slate-700/60 bg-slate-900 text-slate-300 hover:border-indigo-400/60 hover:text-indigo-400 transition-colors"
      >
        <ng-icon name="bootstrapGithub" class="text-xl"></ng-icon>
      </a>
    </div>
  </div>
</header>
