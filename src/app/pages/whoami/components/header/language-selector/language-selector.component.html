<div class="relative inline-block text-left">
  <button
    type="button"
    class="flex items-center gap-2 px-4 py-2 rounded-md border border-slate-700/60 bg-slate-900 text-slate-300 hover:border-indigo-400/60 hover:text-white transition-colors text-sm"
    id="language-menu-button"
    [attr.aria-expanded]="isOpen()"
    aria-haspopup="true"
    (click)="toggle()"
  >
    <ng-icon name="bootstrapTranslate" class="text-indigo-400 text-lg"></ng-icon>
    <span class="font-medium uppercase tracking-wider text-xs">{{
      currentLangId.split('-')[0]
    }}</span>
    <ng-icon
      name="bootstrapChevronDown"
      class="text-slate-500 transition-transform duration-300"
      [class.rotate-180]="isOpen()"
    ></ng-icon>
  </button>

  @if (isOpen()) {
    <div
      class="absolute right-0 mt-3 w-48 rounded-md border border-slate-700/60 bg-slate-950 p-2 z-50 transition-opacity duration-150 ease-out opacity-100 starting:opacity-0"
      role="menu"
      aria-orientation="vertical"
      aria-labelledby="language-menu-button"
      tabindex="-1"
      (keydown.escape)="isOpen.set(false)"
    >
      <div
        class="px-3 py-2 mb-1 text-[10px] font-bold text-slate-500 uppercase tracking-widest"
        i18n
      >
        Choose Language
      </div>

      <div class="space-y-1">
        @for (lang of languages; track lang.code) {
          <button
            class="w-full flex items-center justify-between px-3 py-2.5 rounded-md text-sm transition-colors duration-150 group relative overflow-hidden"
            [class.text-indigo-400]="isCurrent(lang.code)"
            [class.bg-indigo-600/10]="isCurrent(lang.code)"
            [class.text-slate-300]="!isCurrent(lang.code)"
            [class.hover:bg-slate-800/80]="!isCurrent(lang.code)"
            [class.hover:text-white]="!isCurrent(lang.code)"
            role="menuitem"
            (click)="switchLanguage(lang.code)"
          >
            <div class="flex items-center gap-3 relative z-10">
              <span
                class="text-base grayscale group-hover:grayscale-0 transition-all duration-300"
                [class.grayscale-0]="isCurrent(lang.code)"
              >
                {{ lang.flag }}
              </span>
              <span class="font-medium">{{ lang.label }}</span>
            </div>

            @if (isCurrent(lang.code)) {
              <div class="w-1.5 h-1.5 rounded-full bg-indigo-500 relative z-10"></div>
            }
          </button>
        }
      </div>
    </div>

    <!-- Dismiss: outside click (pointer) or Escape (keyboard) -->
    <div
      class="fixed inset-0 z-40 bg-transparent"
      (click)="isOpen.set(false)"
      (keydown.escape)="isOpen.set(false)"
      aria-hidden="true"
    ></div>
  }
</div>
