name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify llms artifacts
        run: |
          for f in \
            dist/whoami/browser/llms.txt \
            dist/whoami/browser/llms-full.txt \
            dist/whoami/browser/en/llms.txt \
            dist/whoami/browser/en/llms-full.txt \
            dist/whoami/browser/pt/llms.txt \
            dist/whoami/browser/pt/llms-full.txt \
            dist/whoami/browser/es/llms.txt \
            dist/whoami/browser/es/llms-full.txt; do
            test -s "$f" || { echo "Erro: arquivo ausente/vazio: $f"; exit 1; }
          done
          echo "OK: llms.txt / llms-full.txt gerados (raiz=en + en/pt/es)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/whoami/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
